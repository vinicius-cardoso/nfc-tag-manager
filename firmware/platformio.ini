; nfc-rfid — retro NFC/RFID manager for PN532 (HSU) + EC11 on the 2.4" ST7789.
; The PN532 runs in HSU/UART mode (DIP 0|0): see docs/wiring/tdisplay-pn532-tft.json
; and the pn532-hsu-only memory.
[env:tft24]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
build_flags =
  -std=gnu++17
  -Wall
  -DBOARD_TFT24=1
build_unflags = -std=gnu++11
