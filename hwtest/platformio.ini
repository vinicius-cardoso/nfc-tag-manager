; Hardware check: T-Display + PN532 (I2C) + 2.4" ST7789/EC11 (SPI). Not the real firmware.
[env:tdisplay]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
  adafruit/Adafruit PN532

[env:pn-adafruit]
extends = env:tdisplay
build_src_filter = -<*> +<../alt/pn_adafruit.cpp>

[env:pn-bisect]
extends = env:tdisplay
build_src_filter = -<*> +<../alt/pn_bisect.cpp>

[env:pn-hsu]
extends = env:tdisplay
build_src_filter = -<*> +<../alt/pn_hsu.cpp>

[env:pn-bitbang]
extends = env:tdisplay
build_src_filter = -<*> +<../alt/pn_bitbang.cpp>

[env:magic]
extends = env:tdisplay
build_src_filter = -<*> +<../alt/magic.cpp>

[env:magic-write]
extends = env:magic
build_flags = -DGEN2_WRITE_TEST
